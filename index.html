    <!--
      Google Fonts, loaded non-blocking: previously this was a CSS @import inside
      index.css, which chains a fetch behind index.css's own fetch (and behind the
      fonts.googleapis.com response referencing fonts.gstatic.com) — 2 sequential
      round trips that block first paint of the ENTIRE page, not just text. Loading
      it as a preloaded stylesheet here lets the browser fetch it in parallel with
      the JS/CSS bundles from the very start of HTML parsing, and the media="print"
      trick keeps it from blocking render at all — text renders immediately in the
      fallback font (see the font-family fallback stack in index.css) and swaps to
      the webfont once it arrives (font-display=swap avoids invisible text either way).
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;750;800;900&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;750;800;900&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;750;800;900&family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;600;700&display=swap" /></noscript>
